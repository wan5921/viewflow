name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black
      - name: Run flake8
        run: flake8 viewflow tests
      - name: Run black --check
        run: black --check viewflow tests

  test:
    name: Django ${{ matrix.django-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        django-version: ["4.0", "4.1", "4.2"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "Django~=${{ matrix.django-version }}.0"
          pip install django-filter djangorestframework django-guardian django-environ
          pip install pytest pytest-django pytest-cov
      - name: Run tests with coverage
        run: |
          pytest --cov=viewflow --cov-report=xml --cov-report=term -v
        env:
          DJANGO_SETTINGS_MODULE: tests.settings
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          fail_ci_if_error: false