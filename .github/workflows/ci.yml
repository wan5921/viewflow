name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint (flake8 + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: Run flake8
        run: |
          flake8 viewflow --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 viewflow --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Run black --check
        run: |
          black --check viewflow

  test:
    name: Test (Django ${{ matrix.django-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        django-version: ["4.0", "4.1", "4.2"]
        include:
          - django-version: "4.0"
            django-package: "Django>=4.0,<4.1"
          - django-version: "4.1"
            django-package: "Django>=4.1,<4.2"
          - django-version: "4.2"
            django-package: "Django>=4.2,<4.3"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "${{ matrix.django-package }}" django-filter pytest pytest-cov pytest-django
          pip install -e .

      - name: Run pytest with coverage
        run: |
          pytest --cov=viewflow --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
