name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            .github/workflows/ci.yml
            setup.py
            tox.ini

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install black==24.1.1 flake8==7.0.0

      - name: Run flake8
        run: flake8 .

      - name: Run black --check
        run: black --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - django-version: '4.0'
            django-spec: 'Django>=4.0,<4.1'
          - django-version: '4.1'
            django-spec: 'Django>=4.1,<4.2'
          - django-version: '4.2'
            django-spec: 'Django>=4.2,<4.3'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            .github/workflows/ci.yml
            setup.py
            tox.ini

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --no-deps -e .
          python -m pip install \
            "${{ matrix.django-spec }}" \
            django-filter==24.3 \
            drf-spectacular==0.27.2 \
            djangorestframework==3.15.2 \
            pyyaml==6.0.1 \
            uritemplate==4.1.1 \
            celery==5.4.0 \
            dash==2.17.1 \
            django-allauth==64.0.0 \
            django-celery-beat==2.1.0 \
            django-formtools==2.5.1 \
            django-guardian==2.4.0 \
            django-import-export==3.3.6 \
            django-polymodels==1.8.0 \
            django-redis==5.4.0 \
            django-reversion==5.0.12 \
            django-simple-history==3.4.0 \
            django-money==3.5.3 \
            dj-database-url==2.1.0 \
            django_sendmail_backend==0.1.2 \
            django-countries==7.6.1 \
            django-environ==0.11.2 \
            django-extensions==3.2.3 \
            graphene-django==3.2.0 \
            django-tz-detect==0.4.0 \
            html2text==2020.1.16 \
            html5lib==1.1 \
            ipython==8.23.0 \
            numpy==1.26.3 \
            openapi-schema-validator==0.6.2 \
            pandas==2.2.0 \
            pillow==10.2.0 \
            psycopg2-binary==2.9.9 \
            pywatchman==1.4.1 \
            watchdog==4.0.1 \
            requests==2.31.0 \
            selenium==4.17.2 \
            sentry-sdk==1.16.0 \
            tblib==3.0.0 \
            hiredis==3.0.0 \
            pytest==8.3.2 \
            pytest-django==4.8.0 \
            pytest-cov==5.0.0

      - name: Run pytest
        run: pytest -m "not selenium and not integration" --cov=viewflow --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: django-${{ matrix.django-version }}
          name: django-${{ matrix.django-version }}
          use_oidc: true
